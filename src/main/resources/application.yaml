spring:
  application:
    name: eatWise

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://localhost:5432/eatwise

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 604800000